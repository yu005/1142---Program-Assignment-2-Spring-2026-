<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學生宿舍最佳配對系統</title>
    <meta name="description" content="學生宿舍最佳配對資訊系統">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <main class="canvas-container">
            <canvas id="matchCanvas"></canvas>
            <div class="canvas-title">
                <h2>配對視覺化</h2>
                <span class="canvas-subtitle" id="canvasSubtitle">設定房間與學生後，將在此顯示配對結果</span>
            </div>
            <div class="matrix-panel" id="matrixPanel" style="display:none;">
                <div class="matrix-header">
                    <h3>📊 偏好分數矩陣</h3>
                    <span class="matrix-hint">分數根據學生偏好自動產生（可點擊修改）</span>
                </div>
                <div class="matrix-wrapper" id="matrixWrapper"></div>
            </div>
            <div class="algo-info" id="algoInfo" style="display:none;">
                <h3 id="algoInfoTitle">演算法執行資訊</h3>
                <div id="algoInfoContent"></div>
            </div>
        </main>

        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <svg viewBox="0 0 24 24" width="26" height="26" stroke="currentColor" stroke-width="2" fill="none"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                    <h1>宿舍配對系統</h1>
                </div>
                <p class="subtitle">學生宿舍最佳配對資訊系統</p>
            </div>

            <!-- 房間設定 -->
            <div class="control-section">
                <h2>🏢 房間設定</h2>
                <div class="input-row-3">
                    <div class="input-group"><label>雙人房</label><input type="number" id="numDouble" class="text-input" min="0" max="3" value="1"></div>
                    <div class="input-group"><label>三人房</label><input type="number" id="numTriple" class="text-input" min="0" max="2" value="1"></div>
                    <div class="input-group"><label>四人房</label><input type="number" id="numQuad" class="text-input" min="0" max="2" value="0"></div>
                </div>
                <div class="btn-row">
                    <button class="action-btn" id="btnGenerate">🏠 生成</button>
                    <button class="action-btn" id="btnExample1">📄 範例1</button>
                    <button class="action-btn" id="btnExample2">📄 範例2</button>
                </div>
                <div class="room-list" id="roomList"></div>
                <div class="map-stats">
                    <div class="stat-chip"><span class="stat-chip-label">房間</span><span class="stat-chip-value" id="statRooms">0</span></div>
                    <div class="stat-chip"><span class="stat-chip-label">總床位</span><span class="stat-chip-value" id="statBeds">0</span></div>
                    <div class="stat-chip"><span class="stat-chip-label">學生</span><span class="stat-chip-value" id="statStudents">0</span></div>
                </div>
            </div>

            <!-- 學生偏好 -->
            <div class="control-section">
                <h2>👤 學生偏好</h2>
                <p class="section-hint">每位學生選擇偏好的房間類型</p>
                <div class="student-list" id="studentList"></div>
            </div>

            <!-- 演算法 -->
            <div class="control-section">
                <h2>⚙️ 演算法選擇</h2>
                <div class="algo-options">
                    <label class="radio-label"><input type="radio" name="algo" value="bnb" checked><span class="radio-dot"></span><span>分支定界法 (B&B) — 最佳解</span></label>
                    <label class="radio-label"><input type="radio" name="algo" value="greedy"><span class="radio-dot"></span><span>貪婪演算法 — 快速近似</span></label>
                    <label class="radio-label"><input type="radio" name="algo" value="dp"><span class="radio-dot"></span><span>動態規劃 (DP) — 精確解</span></label>
                </div>
            </div>

            <div class="action-section">
                <button id="btnMatch" class="primary-btn">🎯 執行配對</button>
                <button id="btnCompare" class="compare-btn">📊 三算法比較</button>
                <button id="btnClear" class="secondary-btn">🗑️ 清除結果</button>
            </div>

            <div class="result-section" id="resultSection" style="display:none;">
                <h2>📋 配對結果</h2>
                <div class="result-card">
                    <div class="result-stat"><span class="stat-label">使用演算法：</span><span class="stat-value-small" id="resAlgo">-</span></div>
                    <div class="result-stat"><span class="stat-label">總偏好分數：</span><span class="stat-value" id="resTotalScore">-</span></div>
                    <div class="result-stat"><span class="stat-label">搜尋節點數：</span><span class="stat-value-small" id="resNodes">-</span></div>
                    <div class="result-stat"><span class="stat-label">修剪次數：</span><span class="stat-value-small" id="resPrune">-</span></div>
                    <div class="result-stat"><span class="stat-label">計算時間：</span><span class="stat-value-small" id="resTime">-</span></div>
                    <hr class="result-divider">
                    <div class="result-stat"><span class="stat-label">分配明細：</span></div>
                    <div class="match-details" id="matchDetails"></div>
                    <hr class="result-divider">
                    <div class="result-stat"><span class="stat-label">穩定性檢測：</span><span class="stat-value-small" id="resStability">-</span></div>
                    <div class="blocking-pairs" id="blockingPairs"></div>
                </div>
            </div>

            <div class="result-section" id="compareSection" style="display:none;">
                <h2>📊 三算法比較</h2>
                <div class="compare-table-wrapper">
                    <table class="compare-table"><thead><tr><th>項目</th><th>B&B</th><th>貪婪</th><th>DP</th></tr></thead><tbody id="compareBody"></tbody></table>
                </div>
            </div>
        </aside>
    </div>
    <script src="app.js"></script>
</body>
</html>
