<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>快遞物流最短配送系統</title>
    <meta name="description" content="快遞物流公司最短配送計畫資訊系統">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- 主畫布區域 -->
        <main class="canvas-container">
            <canvas id="cityMap"></canvas>
            
            <!-- 工具列 -->
            <div class="toolbar" id="toolbar">
                <button class="tool-btn active" id="toolSelect" title="選取 / 拖曳節點">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/></svg>
                    <span>選取</span>
                </button>
                <button class="tool-btn" id="toolAddNode" title="點擊畫布新增城市">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
                    <span>新增城市</span>
                </button>
                <button class="tool-btn" id="toolAddEdge" title="點擊兩個城市來新增道路">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><circle cx="5" cy="12" r="3"/><circle cx="19" cy="12" r="3"/></svg>
                    <span>新增道路</span>
                </button>
                <button class="tool-btn" id="toolDelete" title="點擊節點或邊來刪除">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                    <span>刪除</span>
                </button>
                <div class="tool-separator"></div>
                <button class="tool-btn" id="toolLoadExample" title="載入範例地圖">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                    <span>載入範例</span>
                </button>
                <button class="tool-btn" id="toolClearAll" title="清除所有節點與道路">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
                    <span>全部清除</span>
                </button>
            </div>

            <!-- 圖例 -->
            <div class="legend" id="legend">
                <h3>圖例</h3>
                <div class="legend-item"><span class="legend-dot" style="background:#4f46e5;"></span><span>起點</span></div>
                <div class="legend-item"><span class="legend-dot" style="background:#ea580c;"></span><span>配送目的地</span></div>
                <div class="legend-item"><span class="legend-dot" style="background:#64748b;"></span><span>一般城市</span></div>
                <div class="legend-item"><span class="legend-line" style="background:#059669;"></span><span>最佳配送路線</span></div>
            </div>

            <!-- 狀態提示 -->
            <div class="status-bar" id="statusBar">
                <span id="statusText">使用上方工具列建立城市地圖，或點擊「載入範例」快速開始</span>
            </div>

            <!-- 演算法資訊 -->
            <div class="algo-info" id="algoInfo" style="display:none;">
                <h3 id="algoInfoTitle">演算法執行資訊</h3>
                <div id="algoInfoContent"></div>
            </div>

            <div class="canvas-controls">
                <button id="resetViewBtn" class="icon-btn" title="重置視角">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                </button>
            </div>
        </main>

        <!-- 側邊面板 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <svg viewBox="0 0 24 24" width="26" height="26" stroke="currentColor" stroke-width="2" fill="none"><rect x="1" y="6" width="22" height="15" rx="2" ry="2"/><path d="M1 10h22"/><path d="M8 6V2"/><path d="M16 6V2"/></svg>
                    <h1>快遞配送系統</h1>
                </div>
                <p class="subtitle">最短配送計畫資訊系統</p>
            </div>

            <!-- 地圖資訊 -->
            <div class="control-section">
                <h2>🗺️ 地圖資訊</h2>
                <p class="section-desc">城市地圖為帶權圖 G=(V,E)，節點代表城市，邊權重代表行駛時間。</p>
                <div class="map-stats">
                    <div class="stat-chip"><span class="stat-chip-label">城市數</span><span class="stat-chip-value" id="nodeCount">0</span></div>
                    <div class="stat-chip"><span class="stat-chip-label">道路數</span><span class="stat-chip-value" id="edgeCount">0</span></div>
                </div>
            </div>

            <!-- 配送設定 -->
            <div class="control-section">
                <h2>📍 配送設定</h2>
                <div class="input-group">
                    <label for="startNode">起始城市 (s)</label>
                    <select id="startNode"><option value="">-- 請先建立城市 --</option></select>
                </div>
                <div class="input-group">
                    <label>📦 配送目的地（可複選）</label>
                    <div class="destinations-grid" id="destinationsGrid">
                        <span class="empty-hint">請先在地圖上新增城市</span>
                    </div>
                </div>
            </div>

            <!-- 演算法說明 -->
            <div class="control-section">
                <h2>⚙️ 使用演算法</h2>
                <div class="algo-badge-group">
                    <div class="algo-badge">
                        <span class="algo-badge-step">階段一</span>
                        <span class="algo-badge-name">Dijkstra 最短路徑</span>
                    </div>
                    <span class="algo-badge-arrow">→</span>
                    <div class="algo-badge">
                        <span class="algo-badge-step">階段二</span>
                        <span class="algo-badge-name">分支定界法 (B&B)</span>
                    </div>
                </div>
            </div>

            <!-- 執行按鈕 -->
            <div class="action-section">
                <button id="calculateBtn" class="primary-btn">🚚 計算最短配送計畫</button>
                <button id="clearBtn" class="secondary-btn">🗑️ 清除結果</button>
            </div>

            <!-- 結果區域 -->
            <div class="result-section" id="resultSection" style="display:none;">
                <h2>📋 配送排程結果</h2>
                <div class="result-card">
                    <div class="result-stat">
                        <span class="stat-label">最短配送時間：</span>
                        <span class="stat-value" id="minTimeResult">-</span>
                    </div>
                    <div class="result-stat"><span class="stat-label">搜尋節點數：</span><span class="stat-value-small" id="nodesExploredResult">-</span></div>
                    <div class="result-stat"><span class="stat-label">修剪次數：</span><span class="stat-value-small" id="pruneCountResult">-</span></div>
                    <hr class="result-divider">
                    <div class="result-stat"><span class="stat-label">配送路線順序：</span></div>
                    <div class="route-display" id="routeDisplay"></div>
                    <hr class="result-divider">
                    <div class="result-stat"><span class="stat-label">各段詳細路徑：</span></div>
                    <div class="segment-details" id="segmentDetails"></div>
                </div>
            </div>
        </aside>
    </div>

    <!-- 邊權重對話框 -->
    <div class="modal-overlay" id="edgeModal" style="display:none;">
        <div class="modal">
            <h3>設定道路權重</h3>
            <p id="edgeModalDesc">城市 A ↔ 城市 B</p>
            <div class="input-group">
                <label for="edgeWeightInput">行駛時間（正整數）</label>
                <input type="number" id="edgeWeightInput" min="1" value="1" class="text-input">
            </div>
            <div class="modal-actions">
                <button class="secondary-btn" id="edgeModalCancel">取消</button>
                <button class="primary-btn" id="edgeModalConfirm">確定</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
